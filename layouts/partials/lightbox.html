<!-- Lightbox overlay (vanilla JS, no dependencies) -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="lightbox-close" aria-label="Close">&times;</button>
  <button class="lightbox-prev" aria-label="Previous photo">&#8249;</button>
  <button class="lightbox-next" aria-label="Next photo">&#8250;</button>
  <div class="lightbox-img-wrap">
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
  </div>
  <div class="lightbox-caption" id="lightbox-caption"></div>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script>
(function() {
  var lb      = document.getElementById('lightbox');
  if (!lb) return;
  var img     = document.getElementById('lightbox-img');
  var cap     = document.getElementById('lightbox-caption');
  var counter = document.getElementById('lightbox-counter');
  var items   = [];
  var idx     = 0;

  // Collect all gallery images
  document.querySelectorAll('.gallery-item a').forEach(function(a, i) {
    var src   = a.getAttribute('href');
    var title = '';
    var fc = a.closest('.gallery-item').querySelector('figcaption');
    if (fc) title = fc.textContent;
    items.push({ src: src, title: title });

    a.addEventListener('click', function(e) {
      e.preventDefault();
      open(i);
    });
  });

  function open(i) {
    idx = i;
    show();
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function close() {
    lb.hidden = true;
    document.body.style.overflow = '';
  }

  function show() {
    img.src = items[idx].src;
    img.alt = items[idx].title;
    cap.textContent = items[idx].title;
    counter.textContent = (idx + 1) + ' / ' + items.length;
  }

  function prev() { idx = (idx - 1 + items.length) % items.length; show(); }
  function next() { idx = (idx + 1) % items.length; show(); }

  lb.querySelector('.lightbox-close').addEventListener('click', close);
  lb.querySelector('.lightbox-prev').addEventListener('click', prev);
  lb.querySelector('.lightbox-next').addEventListener('click', next);

  // Click backdrop to close
  lb.addEventListener('click', function(e) {
    if (e.target === lb || e.target.classList.contains('lightbox-img-wrap')) close();
  });

  // Keyboard
  document.addEventListener('keydown', function(e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft')  prev();
    if (e.key === 'ArrowRight') next();
  });

  // Swipe support for mobile
  var touchStartX = 0;
  lb.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
  lb.addEventListener('touchend', function(e) {
    var diff = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diff) > 50) { diff > 0 ? prev() : next(); }
  }, {passive:true});
})();
</script>
