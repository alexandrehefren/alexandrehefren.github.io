baseURL = "https://www.alexandrehefren.com/"
languageCode = "en-GB"
title = "Learn While Live"

# Hugo extended not required but installed — safe to keep
enableRobotsTxt = true
enableGitInfo = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # allow raw HTML in posts (figures, Font Awesome <i> tags)
    [markup.goldmark.extensions]
      footnote = true  # teaching-to-test post uses [^1] footnotes
  [markup.highlight]
    style = "monokailight"
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[taxonomies]
  tag = "tags"

[permalinks]
  posts = "/posts/:slug/"
  photography = "/photography/:slug/"

[pagination]
  pagerSize = 10

[params]
  author = "Alexandre Hefren"
  description = "Alexandre Hefren — Learn While Live. Physicist and genomic data scientist."
  # Top navigation behaviour — pick one:
  #   "static"        nav scrolls away with the page (not pinned); no animation
  #   "sticky"        always pinned at the top; no animation
  #   "top-only"      visible at the top, hides on scroll-down, returns at the top
  #   "hide-on-scroll" hides on scroll-down, reveals on scroll-up
  navBehavior = "static"
  avatar = "/images/photos/AHVJ2874-Edit.jpg"
  profileImage = "/assets/images/DSC_1435-2.jpg"
  defaultTeaser = "/images/photos/AHVJ5357.jpg"
  ogImage = "/assets/images/og-monogram.png"
  googleVerification = "cvNF788qNhZj2ORsKDwbdLHN1nt-w7a0YvtdrPGMQGs"
  googleAnalyticsID = "G-W887YTKJWJ"
  wordsPerMinute = 200

  # ── Disqus comments (shortname from the previous site; threads preserved) ──
  # Must stay above [params.giscus] — keys after a sub-table header would be
  # nested inside it and the template would not find them.
  # disqusShortname = "learnwhilelive"   # dormant: free tier serves ads + trackers

  # ── giscus comments (free, GitHub-based, no ads) ──
  # To enable: go to https://giscus.app, fill in your repo details,
  # and paste the values below. Requires a public GitHub repo with
  # Discussions enabled and the giscus app installed.
  [params.giscus]
    repo       = "alexandrehefren/alexandrehefren.github.io"
    repoID     = "R_kgDOUHkHOA"
    category   = "Announcements"   # only maintainers can open threads here
    categoryID = "DIC_kwDOUHkHOM4DEafq"
    mapping    = "pathname"  # maps each post URL to a Discussion
    theme      = "preferred_color_scheme"
    lang       = "en"

  # ── Contact form (Web3Forms — free, works on static hosts) ──
  # Get a free access key at https://web3forms.com (enter your email,
  # they email you a key — no account needed). Paste it below to make
  # the /contact/ form deliver messages to that email. Left blank, the
  # form shows a friendly "not configured yet" note instead of sending.
  [params.contact]
    web3formsKey = "70c9e50f-38c1-44f3-ad7b-4cc6dc6bb0e8"   # 

  [params.social]
    linkedin = "https://uk.linkedin.com/in/alexandrehefren"
    github = "https://github.com/Alexandre-Hefren"
    orcid = "https://orcid.org/0000-0002-7691-2132"
    email = "mailto:contact@alexandrehefren.com"
    twitter = "https://twitter.com/alexandrehefren"
    instagram = "https://www.instagram.com/alexandre.hefren/"
